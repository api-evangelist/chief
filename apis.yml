aid: chief
name: Chief
description: Chief is a private membership network built to connect and support senior women leaders,
  serving executives across more than 10,000 companies with roughly 44% of members in C-suite roles.
  Membership combines vetted peer Core Groups, one-on-one and group executive coaching, business
  training (including programming with partners such as The Wharton School), member Clubhouses, and
  ChiefX events, plus an enterprise offering for companies sponsoring their women leaders. Chief is a
  membership-and-community company rather than an API provider, so this profile is an identity record
  in the API Evangelist network with no public developer API surface at this time.
